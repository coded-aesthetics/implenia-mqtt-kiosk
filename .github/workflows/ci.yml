name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Authenticate GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      # The lockfile is generated on macOS and lacks linux-specific optional
      # deps (e.g. @rollup/rollup-linux-x64-gnu). Deleting it forces npm to
      # resolve platform-appropriate binaries fresh on the CI runner.
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Typecheck
        run: npm run lint

      - name: Test (ui)
        run: npm test -w ui

      # The server suite is where the data-integrity rules live — the reset
      # guard, export safety, the parsers. It was not running here at all.
      - name: Test (server)
        run: npm test -w server

      # Only the release workflow used to build, so a build break stayed
      # invisible until someone pushed a tag and got no release at all.
      - name: Build
        run: npm run build

      # Layout is the one thing the unit suites cannot see, and the kiosk runs
      # at a fixed 1024x768 with no scrolling allowed. Runs after Build because
      # it serves the built output, which is what actually ships.
      #
      # Chromium only (~115 MB) — the kiosk browser is Chromium, so the other
      # engines would cost CI minutes to test something nobody runs.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests (1024x768)
        run: npm run test:smoke
